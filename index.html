<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS FACTORY アプリサポートポータル</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css" type="text/css">
    <style>
        body { max-width: 800px; margin: auto; padding: 2em; }
        .app-list { list-style: none; padding: 0; }
        .app-item { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 8px; display: flex; align-items: center; }
        .app-icon { width: 60px; height: 60px; border-radius: 22%; margin-right: 20px; }
        .footer { font-size: 0.8em; color: #666; margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>
    <h1>AS FACTORY アプリサポート</h1>
    <p>提供中のアプリのサポートページ一覧です。</p>

    <ul class="app-list">
        <li class="app-item">
            <img src="nir-cam/icon.png" alt="nir cam icon" class="app-icon">
            <div>
                <h3><a href="nir-cam/">nir cam</a></h3>
                <p>日常を、アナログブックマークしよう</p>
            </div>
        </li>
        <li class="app-item">
            <div class="app-icon" style="background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 30px;">🎬</div>
            <div>
                <h3><a href="video-compressor-tool/">動画圧縮ツール</a></h3>
                <p>大きな動画を、驚くほどコンパクトに</p>
            </div>
        </li>
    </ul>

    <div class="footer">
        <p>&copy; 2026 AS FACTORY</p>
    </div>
</body>
</html>
